<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675">
  <defs>
    <linearGradient id="skyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050b0e" />
      <stop offset="55%" stop-color="#0f292a" />
      <stop offset="100%" stop-color="#4a1c17" />
    </linearGradient>
    <radialGradient id="vignette" cx="50%" cy="50%" r="70%">
      <stop offset="55%" stop-color="#000000" stop-opacity="0" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0.72" />
    </radialGradient>
    <linearGradient id="lightLeak" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ef4444" stop-opacity="0.28" />
      <stop offset="22%" stop-color="#10b981" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </linearGradient>
    <filter id="blurLg"><feGaussianBlur stdDeviation="42" /></filter>
    <filter id="blurSm"><feGaussianBlur stdDeviation="8" /></filter>
  </defs>

  <!-- Base Cinema Gradient -->
  <rect width="1200" height="675" fill="url(#skyGrad)" />

