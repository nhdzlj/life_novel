      <path d="M430,395 Q444,418 430,432 Q416,418 430,395 Z" fill="#fbbf24" />
      <path d="M480,508 Q540,485 600,508 Q660,485 720,508 L730,520 L470,520 Z" fill="#fbbf24" opacity="0.75" />
    

  <!-- 35mm Film Light Leak & Vignette -->
  <rect width="1200" height="675" fill="url(#lightLeak)" />
  <rect width="1200" height="675" fill="url(#vignette)" />

  <!-- Subtle Cinema Subtitle & Timestamp Burn-in -->
