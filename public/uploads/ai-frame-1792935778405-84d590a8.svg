  <circle cx="653" cy="253" r="58" fill="#10b981" opacity="0.11" filter="url(#blurLg)" /><circle cx="653" cy="253" r="26.1" fill="#fbbf24" opacity="0.14" filter="url(#blurSm)" /><circle cx="864" cy="390" r="36" fill="#ef4444" opacity="0.11" filter="url(#blurLg)" /><circle cx="864" cy="390" r="16.2" fill="#fbbf24" opacity="0.14" filter="url(#blurSm)" /><circle cx="215" cy="187" r="79" fill="#10b981" opacity="0.11" filter="url(#blurLg)" /><circle cx="215" cy="187" r="35.550000000000004" fill="#fbbf24" opacity="0.14" filter="url(#blurSm)" /><circle cx="426" cy="324" r="57" fill="#ef4444" opacity="0.11" filter="url(#blurLg)" /><circle cx="426" cy="324" r="25.650000000000002" fill="#fbbf24" opacity="0.14" filter="url(#blurSm)" /><circle cx="637" cy="461" r="35" fill="#10b981" opacity="0.11" filter="url(#blurLg)" /><circle cx="637" cy="461" r="15.75" fill="#fbbf24" opacity="0.14" filter="url(#blurSm)" /><circle cx="848" cy="258" r="78" fill="#ef4444" opacity="0.11" filter="url(#blurLg)" /><circle cx="848" cy="258" r="35.1" fill="#fbbf24" opacity="0.14" filter="url(#blurSm)" />
  <circle cx="1103" cy="368" r="2.2" fill="#fbbf24" opacity="0.16" /><circle cx="304" cy="417" r="1.2" fill="#ef4444" opacity="0.24" /><circle cx="665" cy="466" r="4.2" fill="#10b981" opacity="0.32" /><circle cx="1026" cy="515" r="3.2" fill="#fbbf24" opacity="0.40" /><circle cx="227" cy="44" r="2.2" fill="#10b981" opacity="0.48" /><circle cx="588" cy="93" r="1.2" fill="#ef4444" opacity="0.56" /><circle cx="949" cy="142" r="4.2" fill="#fbbf24" opacity="0.16" /><circle cx="150" cy="191" r="3.2" fill="#ef4444" opacity="0.24" /><circle cx="511" cy="240" r="2.2" fill="#10b981" opacity="0.32" /><circle cx="872" cy="289" r="1.2" fill="#fbbf24" opacity="0.40" /><circle cx="73" cy="338" r="4.2" fill="#10b981" opacity="0.48" /><circle cx="434" cy="387" r="3.2" fill="#ef4444" opacity="0.56" /><circle cx="795" cy="436" r="2.2" fill="#fbbf24" opacity="0.16" /><circle cx="1156" cy="485" r="1.2" fill="#ef4444" opacity="0.24" /><circle cx="357" cy="534" r="4.2" fill="#10b981" opacity="0.32" /><circle cx="718" cy="63" r="3.2" fill="#fbbf24" opacity="0.40" /><circle cx="1079" cy="112" r="2.2" fill="#10b981" opacity="0.48" /><circle cx="280" cy="161" r="1.2" fill="#ef4444" opacity="0.56" /><circle cx="641" cy="210" r="4.2" fill="#fbbf24" opacity="0.16" /><circle cx="1002" cy="259" r="3.2" fill="#ef4444" opacity="0.24" /><circle cx="203" cy="308" r="2.2" fill="#10b981" opacity="0.32" /><circle cx="564" cy="357" r="1.2" fill="#fbbf24" opacity="0.40" /><circle cx="925" cy="406" r="4.2" fill="#10b981" opacity="0.48" /><circle cx="126" cy="455" r="3.2" fill="#ef4444" opacity="0.56" /><circle cx="487" cy="504" r="2.2" fill="#fbbf24" opacity="0.16" /><circle cx="848" cy="33" r="1.2" fill="#ef4444" opacity="0.24" /><circle cx="49" cy="82" r="4.2" fill="#10b981" opacity="0.32" /><circle cx="410" cy="131" r="3.2" fill="#fbbf24" opacity="0.40" />

  <!-- Scene Foreground & Focal Subject -->
  
      <!-- City Skyline Blurred in Rain -->
      <g opacity="0.45">
        <rect x="120" y="290" width="75" height="260" fill="#040809" />
        <rect x="220" y="240" width="95" height="310" fill="#040809" />
        <rect x="350" y="310" width="110" height="240" fill="#040809" />
        <rect x="760" y="260" width="90" height="290" fill="#040809" />
        <rect x="880" y="220" width="110" height="330" fill="#040809" />
