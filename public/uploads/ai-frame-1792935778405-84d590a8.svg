    <text x="52" y="58" fill="#fbbf24" font-family="monospace" font-size="15" letter-spacing="3">REC · 2016 · 35MM ARCHIVE</text>
    <text x="600" y="632" fill="#fef3c7" font-family="serif" font-size="22" text-anchor="middle" letter-spacing="4" opacity="0.9">「 Midnight Train 」</text>
